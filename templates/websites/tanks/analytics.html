  ══════════════════════════════════════════════════════════════════
  АНАЛИТИКА И ВЕРИФИКАЦИЯ — редактируйте только этот файл
  ══════════════════════════════════════════════════════════════════

  Этот файл подставляется в index.html вместо служебного маркера
  ANALYTICS при применении шаблона и при сохранении файлов через панель.

  Почему отдельный файл: при обновлении панели шаблон копируется заново
  и index.html перезаписывается. Содержимое этого файла панель
  сохраняет и подставляет обратно — ваши счётчики не пропадают.

  Редактируется через панель: Сайт → Файлы → analytics.html.
  После сохранения index.html пересобирается автоматически.

  ────────────────────────────────────────────────────────────────────
  1. ЯНДЕКС.ВЕБМАСТЕР — верификация сайта
  ────────────────────────────────────────────────────────────────────
  В Вебмастере выберите «Метатег в head». Скопируйте content="..."
  целиком и вставьте вместо слова ЗАМЕНИТЕ_МЕНЯ ниже, затем снимите
  комментарий со строки.

  Пример строки после вставки:
  <meta name="yandex-verification" content="a1b2c3d4e5f6g7h8">

  ────────────────────────────────────────────────────────────────────
  2. ЯНДЕКС.МЕТРИКА — счётчик посещений
  ────────────────────────────────────────────────────────────────────
  В Метрике создайте счётчик, скопируйте номер (8 цифр) и вставьте
  его вместо 00000000 в двух местах ниже, затем снимите комментарий
  с блока.

  Рекомендации для заглушки:
  - информер (кнопка с цифрами) отключён: visitorGoals и прочее не нужно;
  - Вебвизор лучше выключить — запись сессий посторонних посетителей
    на декоративном сайте лишняя;
  - клики и скроллы (карта кликов) можно оставить.

  Метрика отправляет данные на mc.yandex.ru. Если когда-нибудь на сайт
  добавится CSP со script-src, в него надо будет дописать
  https://mc.yandex.ru — иначе счётчик молча не загрузится.
  ══════════════════════════════════════════════════════════════════
