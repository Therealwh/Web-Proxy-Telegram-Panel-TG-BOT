<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Личный кабинет</title>
<!-- Официальный скрипт Telegram WebApp, САМОХОСТИНГ: telegram.org заблокирован
     у части провайдеров РФ — внешний <head>-скрипт блокировал парсер, и всё
     приложение висело в «загрузка…». Локальный файл грузится мгновенно. -->
<script src="/miniapp/tgwebapp.js"></script>
<style>
    :root {
        --bg: #0d1220;
        --card: #151d31;
        --card2: #1b2440;
        --line: #232e4a;
        --text: #eef2fa;
        --muted: #8b96ad;
        --accent: #3390ec;
        --accent-soft: rgba(51, 144, 236, .14);
        --ok: #34d186;
        --warn: #ffb020;
        --bad: #ff5c5c;
        --radius: 18px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
        font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
        background: var(--bg); color: var(--text);
        padding-bottom: calc(72px + env(safe-area-inset-bottom));
        overscroll-behavior-y: contain;
    }
    body.light { --bg:#f2f5fa; --card:#ffffff; --card2:#eef2f8; --line:#dfe5ef; --text:#17212b; --muted:#707b89; --accent-soft: rgba(51,144,236,.1); }

    .wrap { max-width: 520px; margin: 0 auto; padding: 14px 14px 0; }

    /* ── Шапка ── */
    .header { display:flex; align-items:center; justify-content:space-between; gap:10px; padding: 6px 2px 14px; }
    .hello { font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
    .hello small { display:block; font-size: 12.5px; font-weight: 500; color: var(--muted); margin-top: 2px; }
    .balance-chip {
        display:flex; flex-direction:column; align-items:flex-end; gap:1px;
        background: linear-gradient(135deg, var(--accent), #1f7fd0);
        color:#fff; border:none; cursor:pointer; border-radius: 14px;
        padding: 9px 14px; box-shadow: 0 6px 18px rgba(51,144,236,.35);
    }
    .balance-chip b { font-size: 16.5px; }
    .balance-chip span { font-size: 10px; opacity:.85; text-transform: uppercase; letter-spacing:.06em; }

    /* ── Вкладки ── */
    .page { display:none; animation: fade .18s ease; }
    .page.active { display:block; }
    @keyframes fade { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform:none;} }

    /* ── Карточки прокси ── */
    .proxy { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
             padding: 16px; margin-bottom: 12px; }
    .proxy .top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom: 4px; }
    .proxy .name { font-size: 16.5px; font-weight: 700; display:flex; align-items:center; gap:8px; }
    .dot { width:9px; height:9px; border-radius:50%; background: var(--muted); flex-shrink:0; }
    .dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(52,209,134,.7); }
    .dot.bad { background: var(--bad); }
    .badge { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 8px;
             background: var(--accent-soft); color: var(--accent); }
    .badge.warn { background: rgba(255,176,32,.14); color: var(--warn); }
    .badge.bad { background: rgba(255,92,92,.14); color: var(--bad); }
    .term { color: var(--muted); font-size: 13px; margin: 3px 0 10px; }
    .term b { color: var(--text); }
    .bar { height: 5px; border-radius: 4px; background: var(--card2); overflow:hidden; margin-bottom: 13px; }
    .bar i { display:block; height:100%; border-radius:4px;
             background: linear-gradient(90deg, var(--ok), #7ee2b6); transition: width .4s; }
    .bar i.low { background: linear-gradient(90deg, var(--warn), #ffd27a); }
    .bar i.crit { background: linear-gradient(90deg, var(--bad), #ff9a9a); }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    .btn {
        display:inline-flex; align-items:center; justify-content:center; gap:7px;
        border:none; cursor:pointer; border-radius: 13px; font-weight: 700; font-size: 14px;
        padding: 11px 15px; text-decoration:none; color: var(--text); background: var(--card2);
        transition: transform .08s ease, filter .15s; font-family: inherit;
    }
    .btn:active { transform: scale(.96); }
    .btn.primary { background: linear-gradient(135deg, var(--accent), #1f7fd0); color:#fff;
                   box-shadow: 0 5px 14px rgba(51,144,236,.3); }
    .btn.ok { background: linear-gradient(135deg, var(--ok), #23b474); color:#fff; }
    .btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--muted); }
    .btn.wide { width: 100%; }
    .btn.mini { padding: 8px 12px; font-size: 12.5px; border-radius: 10px; }
    .btn[disabled] { opacity: .45; pointer-events: none; }

    /* ── Тарифы ── */
    .tariff { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
              padding: 16px; margin-bottom: 12px; position: relative; overflow:hidden; }
    .tariff .tname { font-size: 16.5px; font-weight: 800; }
    .tariff .row { display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
    .tariff .price { font-size: 19px; font-weight: 800; color: var(--accent); }
    .spec { display:flex; gap: 6px; flex-wrap:wrap; margin-top: 9px; }
    .chip { font-size: 11.5px; color: var(--muted); background: var(--card2);
            padding: 5px 10px; border-radius: 8px; font-weight: 600; }
    .pop { position:absolute; top: 12px; right: -30px; transform: rotate(38deg);
           background: linear-gradient(135deg, var(--ok), #23b474); color:#fff;
           font-size: 10px; font-weight: 800; padding: 4px 36px; letter-spacing: .04em; }

    /* ── Партнёрка ── */
    .ref-hero { background: linear-gradient(140deg, #7b5cff 0%, #3390ec 60%, #2ea6ff 100%);
                border-radius: 22px; padding: 22px 18px; color:#fff; margin-bottom: 12px;
                box-shadow: 0 10px 26px rgba(90,90,255,.35); }
    .ref-hero h2 { font-size: 19px; margin-bottom: 5px; }
    .ref-hero p { font-size: 13.5px; opacity: .92; line-height: 1.45; }
    .ref-stats { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .ref-stat { background: var(--card); border:1px solid var(--line); border-radius: var(--radius);
                padding: 15px; text-align:center; }
    .ref-stat b { font-size: 22px; display:block; }
    .ref-stat span { color: var(--muted); font-size: 12px; }
    .reflink { background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius);
               padding: 14px; word-break: break-all; font-size: 12.5px; color: var(--muted);
               margin-bottom: 10px; user-select: all; }
    .reflink b { color: var(--text); }

    /* ── Мелочи ── */
    .empty { text-align:center; padding: 44px 20px; color: var(--muted); }
    .empty .big { font-size: 46px; margin-bottom: 12px; }
    .empty p { font-size: 14.5px; line-height: 1.5; margin-bottom: 18px; }
    .sec-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .09em;
                 color: var(--muted); margin: 4px 2px 10px; }
    .skel { height: 96px; border-radius: var(--radius); background: linear-gradient(100deg, var(--card) 40%, var(--card2) 50%, var(--card) 60%);
            background-size: 200% 100%; animation: shimmer 1.2s infinite; margin-bottom: 12px; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .statuslink { display:block; text-align:center; color: var(--muted); font-size: 13px;
                  padding: 14px 0 4px; text-decoration: none; }

    /* ── Нижняя навигация ── */
    .tabbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
              background: var(--card);
              background: color-mix(in srgb, var(--card) 88%, transparent);
              backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
              border-top: 1px solid var(--line);
              display:flex; justify-content:space-around;
              padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); }
    .tabbar button { background:none; border:none; cursor:pointer; font-family:inherit;
                     display:flex; flex-direction:column; align-items:center; gap:2px;
                     color: var(--muted); font-size: 10.5px; font-weight: 700; width: 84px;
                     padding: 5px 0; border-radius: 12px; }
    .tabbar button .ico { font-size: 21px; transition: transform .15s; }
    .tabbar button.active { color: var(--accent); }
    .tabbar button.active .ico { transform: translateY(-1px) scale(1.12); }

    /* ── Шторка ── */
    .overlay { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(5,8,18,.62); z-index: 90;
               opacity: 0; pointer-events: none; transition: opacity .2s; }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
             background: var(--card); border-radius: 24px 24px 0 0;
             padding: 18px 18px calc(22px + env(safe-area-inset-bottom));
             transform: translateY(105%); transition: transform .26s cubic-bezier(.3,.9,.3,1);
             max-width: 520px; margin: 0 auto; max-height: 86vh; overflow-y: auto; }
    .sheet.open { transform: none; }
    .grab { width: 40px; height: 4px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
    .sheet h3 { font-size: 17.5px; margin-bottom: 4px; }
    .sheet .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; line-height: 1.45; }
    .pay-option { display:flex; align-items:center; gap: 12px; width: 100%; text-align: left;
                  background: var(--card2); border: 1.5px solid transparent; border-radius: 15px;
                  padding: 13px 14px; margin-bottom: 9px; cursor:pointer; color: var(--text);
                  font-family: inherit; font-size: 14.5px; font-weight: 700; transition: transform .08s; }
    .pay-option:active { transform: scale(.98); }
    .pay-option.selected { border-color: var(--accent); background: var(--accent-soft); }
    .pay-option .pi { font-size: 21px; }
    .pay-option small { display:block; font-weight: 500; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
    .pay-option .sum { margin-left:auto; font-weight: 800; color: var(--accent); white-space: nowrap; }
    .req { background: var(--card2); border-radius: 14px; padding: 6px 12px; margin-bottom: 8px;
           display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .req .lbl { color: var(--muted); font-size: 12px; }
    .req .val { font-weight: 700; font-size: 14px; user-select: all; word-break: break-all; text-align:right; }
    .amounts { display:grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 10px; }
    .amounts button { background: var(--card2); border: 1.5px solid transparent; color: var(--text);
                      border-radius: 13px; padding: 13px; font-size: 15.5px; font-weight: 800;
                      cursor:pointer; font-family: inherit; }
    .amounts button.selected { border-color: var(--accent); background: var(--accent-soft); }
    .amount-input { width: 100%; background: var(--card2); border: 1.5px solid var(--line); color: var(--text);
                    border-radius: 13px; padding: 13px 14px; font-size: 16px; font-weight: 700;
                    margin-bottom: 10px; outline: none; font-family: inherit; }
    .amount-input:focus { border-color: var(--accent); }
    .note { color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 10px; }

    /* ── Тост ── */
    .toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom));
             transform: translateX(-50%) translateY(20px); background: #202b47; color:#fff;
             padding: 11px 20px; border-radius: 14px; font-size: 13.5px; font-weight: 600;
             opacity: 0; pointer-events: none; transition: all .25s; z-index: 200;
             max-width: 88vw; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
    .toast.show { opacity: 1; transform: translateX(-50%); }
    .toast.ok { background: #1d7a4d; } .toast.bad { background: #a83232; }
</style>
</head>
<body>
<div class="wrap">
    <div id="booterr" style="display:none; background:rgba(255,92,92,.15); color:#ff9a9a; border:1px solid rgba(255,92,92,.4); border-radius:12px; padding:10px 12px; margin-bottom:10px; font-size:12.5px; word-break:break-word;"></div>
    <div class="header">
        <div class="hello" id="hello">Личный кабинет<small id="helloSub">загрузка… v1.30.5</small></div>
        <button class="balance-chip" id="balanceChip" onclick="openDeposit()">
            <b id="balanceVal">—</b><span>пополнить</span>
        </button>
    </div>

    <div class="page" id="page-proxies"></div>
    <div class="page" id="page-shop"></div>
    <div class="page" id="page-ref"></div>
</div>

<nav class="tabbar">
    <button id="tab-btn-proxies" class="active" onclick="showTab('proxies')"><span class="ico">🛰</span>Мои прокси</button>
    <button id="tab-btn-shop" onclick="showTab('shop')"><span class="ico">🚀</span>Тарифы</button>
    <button id="tab-btn-ref" onclick="showTab('ref')"><span class="ico">🤝</span>Партнёрка</button>
</nav>

<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
// Диагностика в отдельном ES5-блоке: работает даже если основной скрипт
// не прошёл разбор — любая ошибка становится видимым текстом на экране.
window.onerror = function(msg, src, line) {
    var el = document.getElementById('booterr');
    if (el) { el.style.display = 'block'; el.textContent = '⚠️ Ошибка: ' + msg + ' (строка ' + line + ')'; }
};
window.addEventListener('unhandledrejection', function(e) {
    var el = document.getElementById('booterr');
    var r = e && e.reason;
    if (el) { el.style.display = 'block'; el.textContent = '⚠️ Ошибка: ' + (r && r.message ? r.message : r); }
});
</script>
<script>
'use strict';
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
let TOKEN = null;
let DATA = null;      // overview
let TARIFFS = null;
let pendingSheet = null; // {type:'purchase'|'renew'|'deposit', ...}

// ── Telegram: тема, раскладка, тактиль (каждый вызов защищён — старые клиенты
//    бросают исключения на новых методах, и это не должно ломать загрузку) ──
function tgSafe(fn) { try { return fn(); } catch (e) { return undefined; } }
function initTg() {
    if (!tg) return;
    tgSafe(() => tg.ready());
    tgSafe(() => tg.expand());
    tgSafe(() => tg.setHeaderColor('bg_color'));
    tgSafe(() => {
        if (!tg.themeParams || !tg.themeParams.bg_color) return;
        const t = tg.themeParams, light = tg.colorScheme === 'light';
        if (light) document.body.classList.add('light');
        const root = document.documentElement.style;
        if (t.bg_color) root.setProperty('--bg', t.bg_color);
        if (t.secondary_bg_color) { root.setProperty('--card', t.secondary_bg_color); root.setProperty('--card2', t.bg_color); }
        if (t.text_color) root.setProperty('--text', t.text_color);
        if (t.hint_color) root.setProperty('--muted', t.hint_color);
        if (t.link_color) root.setProperty('--accent', t.link_color);
        if (t.button_color) root.setProperty('--accent', t.button_color);
    });
}
function haptic(kind) {
    try {
        if (!tg || !tg.HapticFeedback) return;
        if (kind === 'ok' || kind === 'bad') tg.HapticFeedback.notificationOccurred(kind);
        else tg.HapticFeedback.impactOccurred(kind || 'light');
    } catch (e) {}
}

// ── API ──
// Таймаут без AbortController: он отсутствует в старых вебвью (Chromium < 66),
// а нам нужен запуск везде. Запрос после таймаута просто игнорируется.
function fetchWithTimeout(url, opts = {}, timeoutMs = 10000) {
    return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('Таймаут сети — проверь интернет')), timeoutMs);
        fetch(url, opts).then(
            (res) => { clearTimeout(timer); resolve(res); },
            (err) => { clearTimeout(timer); reject(new Error('Нет связи с сервером — проверь интернет')); }
        );
    });
}

async function api(path, opts = {}) {
    let res;
    try {
        res = await fetchWithTimeout('/api/miniapp' + path, {
            method: opts.method || 'GET',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
            body: opts.body ? JSON.stringify(opts.body) : undefined,
        });
    } catch (e) {
        throw new Error('Нет связи с сервером — проверь интернет и повтори');
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
        if (res.status === 401 && !path.startsWith('/auth')) { throw new Error('Сессия истекла — переоткройте приложение'); }
        throw new Error(data.error || 'Ошибка ' + res.status);
    }
    return data;
}

// ── Тост ──
let toastTimer = null;
function toast(msg, kind) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show ' + (kind || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'toast'; }, 3200);
}

// ── Шторка ──
function openSheet(html) {
    document.getElementById('sheet').innerHTML = '<div class="grab"></div>' + html;
    document.getElementById('overlay').classList.add('open');
    document.getElementById('sheet').classList.add('open');
}
function closeSheet() {
    pendingSheet = null;
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('sheet').classList.remove('open');
}

// ── Копирование ──
// Значения (реквизиты, ссылки) НЕ вставляем в onclick-строки: апостроф в
// реквизитах ломал бы обработчик. Делегирование по data-copy.
document.addEventListener('click', function(e) {
    var el = e.target;
    while (el && el !== document && !el.getAttribute) el = el.parentNode;
    if (!el || el === document) return;
    var val = el.getAttribute('data-copy');
    if (val !== null && val !== undefined && val !== '') {
        copy(val, el.getAttribute('data-copy-label') || 'Скопировано');
    }
});
function copy(text, what) {
    const done = () => { haptic('ok'); toast((what || 'Скопировано') + ' ✓', 'ok'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {} 
    document.body.removeChild(ta);
}

// ── Вкладки ──
function showTab(name) {
    haptic('light');
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tabbar button').forEach(b => b.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.getElementById('tab-btn-' + name).classList.add('active');
}

// ── Загрузка ──
function showBootError(msg) {
    document.getElementById('helloSub').textContent = 'ошибка';
    document.getElementById('page-proxies').innerHTML =
        `<div class="empty"><div class="big">😴</div><p>${esc(msg)}</p>
         <button class="btn primary" onclick="boot()">↻ Повторить</button></div>`;
    showTab('proxies');
}

// initData приходит и через tg.initData, и через location.hash (tgWebAppData) —
// старые клиенты заполняют только хеш. Берём первое непустое.
function extractInitData() {
    if (tg && tg.initData) return tg.initData;
    try {
        const m = (location.hash || '').match(/tgWebAppData=([^&]+)/);
        if (m) return decodeURIComponent(m[1]);
    } catch (e) { /* нет хеша — не страшно */ }
    return '';
}

async function boot() {
    try { initTg(); } catch (e) { /* даже это не должно останавливать загрузку */ }
    if (!tg) {
        showBootError('Скрипт Telegram не загрузился. Закройте приложение и откройте его из бота ещё раз.');
        return;
    }
    const initData = extractInitData();
    if (!initData) {
        // Диагностика вместо тупика: видно, откуда открыто и дошёл ли вход
        let env;
        try {
            env = 'платформа: ' + (tg.platform || 'неизвестна') +
                  ' · клиент: ' + (tg.version || '?') +
                  ' · данные входа в ссылке: ' + (/tgWebAppData=/.test(location.hash || '') ? 'есть' : 'нет');
        } catch (e) { env = ''; }
        document.getElementById('hello').innerHTML = 'Откройте через бота<small>приложение работает внутри Telegram</small>';
        document.getElementById('page-proxies').innerHTML =
            '<div class="empty"><div class="big">🤖</div>' +
            '<p>Это приложение открывается из нашего бота:<br>открой чат с ботом и нажми «📱 Приложение» внизу.</p>' +
            '<button class="btn primary" onclick="boot()">↻ Проверить снова</button>' +
            (env ? `<p class="note" style="margin-top:14px">${esc(env)}</p>` : '') +
            '</div>';
        showTab('proxies');
        return;
    }
    try {
        document.getElementById('helloSub').textContent = 'подключение…';
        const authRes = await fetchWithTimeout('/api/miniapp/auth', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ initData }),
        });
        const auth = await authRes.json().catch(() => ({}));
        if (!authRes.ok || !auth.token) throw new Error(auth.error || 'Не удалось войти (' + authRes.status + ')');
        TOKEN = auth.token;
        if (auth.user && auth.user.first_name) {
            const hello = document.getElementById('hello');
            if (hello.childNodes[0]) hello.childNodes[0].textContent = `Привет, ${auth.user.first_name}!`;
        }
        await refresh(true);
    } catch (e) {
        showBootError(e.message || 'Не удалось загрузиться');
    }
}

async function refresh(first) {
    document.getElementById('helloSub').textContent = 'обновляю…';
    try {
        [DATA, TARIFFS] = await Promise.all([api('/overview'), api('/tariffs')]);
        renderAll();
        document.getElementById('helloSub').textContent = 'всё под рукой 👇';
    } catch (e) {
        document.getElementById('helloSub').textContent = e.message;
    }
}

function renderAll() {
    document.getElementById('balanceVal').textContent = `${DATA.balance} ${DATA.currency_sign}`;
    renderProxies();
    renderShop();
    renderRef();
}

// ── Вкладка: мои прокси ──
function daysBadge(p) {
    if (p.status === 'blocked') return '<span class="badge bad">Заблокирован</span>';
    if (p.status === 'expired') return '<span class="badge bad">Истёк</span>';
    if (p.days_left === null) return '<span class="badge">Бессрочно</span>';
    if (p.days_left <= 2) return `<span class="badge bad">Осталось ${p.days_left} дн.</span>`;
    if (p.days_left <= 7) return `<span class="badge warn">Осталось ${p.days_left} дн.</span>`;
    return `<span class="badge">Осталось ${p.days_left} дн.</span>`;
}

function renderProxies() {
    const el = document.getElementById('page-proxies');
    if (!DATA.proxies.length) {
        el.innerHTML = `<div class="empty"><div class="big">🚀</div>
            <p>У вас пока нет прокси.<br>Выберите тариф — доступ выдаётся автоматически.</p>
            <button class="btn primary" onclick="showTab('shop')">Выбрать тариф</button></div>`;
        return;
    }
    el.innerHTML = '<div class="sec-title">Мои прокси</div>' + DATA.proxies.map(p => {
        const totalDays = p.days_left === null ? null : Math.max(p.days_left, 1);
        const pct = p.days_left === null ? 100 : Math.min(100, Math.round(p.days_left / Math.max(totalDays, 30) * 100));
        const barCls = p.days_left !== null && p.days_left <= 2 ? 'crit' : (p.days_left !== null && p.days_left <= 7 ? 'low' : '');
        const active = p.status === 'active';
        return `<div class="proxy">
            <div class="top">
                <div class="name"><span class="dot ${active ? 'ok' : 'bad'}"></span>${esc(p.username)}</div>
                ${daysBadge(p)}
            </div>
            <div class="term">до <b>${p.expires_at ? fmtDate(p.expires_at) : '∞'}</b>${p.balance > 0 ? ` · на строке <b>${p.balance} ${DATA.currency_sign}</b>` : ''}</div>
            <div class="bar"><i class="${barCls}" style="width:${pct}%"></i></div>
            <div class="actions">
                ${p.web_link ? `<a class="btn primary" href="${escAttr(p.web_link)}">🌐 Подключить Web</a>` : ''}
                ${p.mtproto_link ? `<a class="btn" href="${escAttr(p.mtproto_link)}">🔌 MTProto</a>` : ''}
                <button class="btn ghost" data-copy="${escAttr(p.mtproto_link || p.web_link || '')}" data-copy-label="Ссылка">📋</button>
                ${active ? `<button class="btn ok" onclick="openRenew(${p.id})">♻️ Продлить</button>` : ''}
            </div>
        </div>`;
    }).join('') + `${DATA.status_url ? `<a class="statuslink" href="${escAttr(DATA.status_url)}" target="_blank">🟢 Статус сервиса</a>` : ''}`;
}

// ── Вкладка: тарифы ──
function protoChips(t) {
    const map = { web: '🌐 Web Proxy', mtproto: '🔌 MTProto', both: '🌐 Web + 🔌 MTP' };
    return `<div class="spec">
        <span class="chip">${map[t.protocols] || t.protocols}</span>
        <span class="chip">⏱ ${t.days} дн.</span>
        ${t.max_ips ? `<span class="chip">👥 ${t.max_ips} IP</span>` : '<span class="chip">👥 без лимита IP</span>'}
        ${t.quota_gb ? `<span class="chip">📊 ${t.quota_gb} ГБ</span>` : ''}
    </div>`;
}

function renderShop() {
    const el = document.getElementById('page-shop');
    if (!TARIFFS.tariffs.length) {
        el.innerHTML = '<div class="empty"><div class="big">📦</div><p>Тарифы скоро появятся</p></div>';
        return;
    }
    el.innerHTML = '<div class="sec-title">Выберите тариф</div>' + TARIFFS.tariffs.map((t, i) =>
        `<div class="tariff">
            ${i === 1 ? '<div class="pop">ХИТ</div>' : ''}
            <div class="tname">${esc(t.name)}</div>
            ${protoChips(t)}
            <div class="row">
                <div class="price">${esc(t.price_text)}</div>
                <button class="btn primary" onclick="openBuy(${t.id})">Купить</button>
            </div>
        </div>`).join('');
}

// ── Вкладка: партнёрка ──
function renderRef() {
    const el = document.getElementById('page-ref');
    if (!DATA.referral) {
        el.innerHTML = `<div class="empty"><div class="big">🤝</div>
            <p>Партнёрская программа откроется после первой покупки —<br>получите прокси и приглашайте друзей.</p></div>`;
        return;
    }
    const r = DATA.referral;
    el.innerHTML = `
        <div class="ref-hero">
            <h2>Приглашай — зарабатывай</h2>
            <p>С каждой оплаты приглашённого тобой человека тебе капает <b>10% на баланс</b>. Друг переходит по ссылке — и закрепляется за тобой навсегда.</p>
        </div>
        <div class="ref-stats">
            <div class="ref-stat"><b>${r.invited}</b><span>приглашено</span></div>
            <div class="ref-stat"><b>${r.earned} ${DATA.currency_sign}</b><span>заработано</span></div>
        </div>
        <div class="sec-title">Твоя ссылка</div>
        <div class="reflink" data-copy="${escAttr(r.link)}" data-copy-label="Ссылка"><b>${esc(r.link)}</b></div>
        <div class="actions">
            <button class="btn primary" onclick="shareRef()">📤 Поделиться</button>
            <button class="btn" data-copy="${escAttr(r.link)}" data-copy-label="Ссылка">📋 Копировать</button>
        </div>
        <p class="note" style="margin-top:14px">Заработанное падает прямо на баланс — им можно продлевать прокси без оплаты картой.</p>`;
}

function shareRef() {
    haptic('ok');
    const url = `https://t.me/share/url?url=${encodeURIComponent(DATA.referral.link)}&text=${encodeURIComponent('Быстрый прокси прямо в Telegram — подключается в один тап 👌')}`;
    if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
    else window.open(url, '_blank');
}

// ── Покупка ──
function openBuy(tariffId) {
    haptic('light');
    const t = TARIFFS.tariffs.find(x => x.id === tariffId);
    if (!t) return;
    pendingSheet = { type: 'purchase', tariff: t };
    openSheet(`
        <h3>${esc(t.name)}</h3>
        <div class="sub">${t.days} дн. · ${esc(t.price_text)} — доступ выдаётся автоматически после оплаты.</div>
        ${payOptions(t.price)}
    `);
}
function openRenew(clientId) {
    haptic('light');
    const p = DATA.proxies.find(x => x.id === clientId);
    if (!p) return;
    pendingSheet = { type: 'renew', clientId };
    openSheet(`
        <h3>Продлить ${esc(p.username)}</h3>
        <div class="sub">Выберите тариф продления:</div>
        ${TARIFFS.tariffs.map(t => `
            <div class="tariff">
                <div class="tname">${esc(t.name)}</div>
                ${protoChips(t)}
                <div class="row">
                    <div class="price">${esc(t.price_text)}</div>
                    <button class="btn primary" onclick="openRenewPay(${t.id})">Выбрать</button>
                </div>
            </div>`).join('')}
    `);
}
function openRenewPay(tariffId) {
    const t = TARIFFS.tariffs.find(x => x.id === tariffId);
    if (!t || !pendingSheet) return;
    pendingSheet.tariff = t;
    openSheet(`
        <h3>Продление · ${esc(t.name)}</h3>
        <div class="sub">${esc(t.price_text)} — срок добавится к текущему.</div>
        ${payOptions(t.price)}
    `);
}

function payOptions(price) {
    const enough = DATA.balance >= price;
    return `
        ${DATA.has_requisites ? `
        <button class="pay-option" onclick="chooseMethod('manual')">
            <span class="pi">💳</span>
            <span>Карта админа<small>перевод по реквизитам, подтвердит админ</small></span>
            <span class="sum">${esc(fmtPrice(price))}</span>
        </button>` : ''}
        <button class="pay-option" ${enough ? '' : 'disabled'} onclick="chooseMethod('balance')">
            <span class="pi">💰</span>
            <span>С баланса<small>${enough ? 'сразу, без подтверждения' : 'недостаточно средств'}</small></span>
            <span class="sum">${DATA.balance} ${DATA.currency_sign}</span>
        </button>
        ${!DATA.has_requisites && !enough ? '<div class="note">Реквизиты не настроены. Попросите ссылку на оплату в поддержке: ' + esc(DATA.support) + '</div>' : ''}
    `;
}

async function chooseMethod(method) {
    const ps = pendingSheet;
    if (!ps) return;
    haptic('light');
    try {
        if (ps.type === 'purchase') {
            if (method === 'balance') {
                openSheet('<h3>Покупаю…</h3><div class="sub">Выдаю прокси, секунду.</div>');
                const r = await api('/purchase', { method: 'POST', body: { tariffId: ps.tariff.id, method } });
                haptic('ok');
                closeSheet();
                await refresh();
                showTab('proxies');
                toast(`Готово! Прокси ${r.proxy.username} активен 🎉`, 'ok');
            } else {
                createManual(ps.tariff, null, ps.tariff.price_text);
            }
        } else if (ps.type === 'renew') {
            if (method === 'balance') {
                openSheet('<h3>Продлеваю…</h3><div class="sub">Списываю с баланса, секунду.</div>');
                const r = await api('/renew', { method: 'POST', body: { clientId: ps.clientId, tariffId: ps.tariff.id, method } });
                haptic('ok');
                closeSheet();
                await refresh();
                toast(`Продлено до ${fmtDate(r.proxy.expires_at)} ✓`, 'ok');
            } else {
                const p = DATA.proxies.find(x => x.id === ps.clientId);
                createManual(ps.tariff, p ? p.id : null, ps.tariff.price_text);
            }
        }
    } catch (e) {
        haptic('bad');
        openSheet(`<h3>Не получилось</h3><div class="sub">${esc(e.message)}</div>
                   <button class="btn wide" onclick="closeSheet()">Понятно</button>`);
    }
}

// Счёт «картой админа»: реквизиты + «Я оплатил»
async function createManual(tariff, clientId, priceText) {
    try {
        let r;
        if (pendingSheet && pendingSheet.type === 'renew') {
            r = await api('/renew', { method: 'POST', body: { clientId, tariffId: tariff.id, method: 'manual' } });
        } else {
            r = await api('/purchase', { method: 'POST', body: { tariffId: tariff.id, method: 'manual' } });
        }
        showRequisites(r.payment_id, priceText);
    } catch (e) {
        haptic('bad');
        toast(e.message, 'bad');
    }
}

function showRequisites(paymentId, priceText) {
    const req = DATA.requisites;
    const rows = [];
    if (req.card) rows.push(['💳 Карта', req.card]);
    if (req.phone) rows.push(['📱 СБП / телефон', req.phone]);
    if (req.bank) rows.push(['🏦 Банк', req.bank]);
    openSheet(`
        <h3>Оплата #${paymentId}</h3>
        <div class="sub">Переведите <b style="color:var(--text)">${esc(priceText)}</b> по реквизитам и нажмите «Я оплатил» — админ подтвердит, и доступ придёт автоматически.</div>
        ${rows.map(([l, v]) => `<div class="req" data-copy="${escAttr(v)}" data-copy-label="${esc(l)}">
            <span class="lbl">${l}</span><span class="val">${esc(v)}</span></div>`).join('')}
        <button class="btn ok wide" onclick="markPaid(${paymentId})">✅ Я оплатил</button>
        <div class="note">Если что-то пойдёт не так — поддержка: ${esc(DATA.support)}</div>
    `);
}

async function markPaid(paymentId) {
    try {
        await api('/paid', { method: 'POST', body: { paymentId } });
        haptic('ok');
        closeSheet();
        toast('Отправлено админу — подтвердим в ближайшие минуты ✓', 'ok');
    } catch (e) { toast(e.message, 'bad'); }
}

// ── Пополнение ──
function openDeposit() {
    if (!DATA) { toast('Ещё загружаюсь, секунду…'); return; }
    haptic('light');
    const presets = [100, 300, 500, 1000];
    openSheet(`
        <h3>Пополнить баланс</h3>
        <div class="sub">Балансом можно платить за прокси без переводов.</div>
        ${DATA.has_requisites ? `
        <div class="amounts" id="amountGrid">
            ${presets.map(v => `<button onclick="pickAmount(${v}, this)">${v} ${DATA.currency_sign}</button>`).join('')}
        </div>
        <input class="amount-input" id="amountInput" type="number" inputmode="decimal" min="1"
               placeholder="Своя сумма" oninput="clearPicks()">
        <button class="btn primary wide" onclick="createDeposit()">💳 Перевести по реквизитам</button>
        <div class="note">После перевода нажмите «Я оплатил» — админ подтвердит зачисление.</div>`
        : `<div class="note">Реквизиты не настроены. Напишите в поддержку: ${esc(DATA.support)}</div>`}
    `);
}
let pickedAmount = null;
function pickAmount(v, btn) {
    pickedAmount = v;
    document.getElementById('amountInput').value = '';
    document.querySelectorAll('#amountGrid button').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    haptic('light');
}
function clearPicks() {
    pickedAmount = null;
    document.querySelectorAll('#amountGrid button').forEach(b => b.classList.remove('selected'));
}
async function createDeposit() {
    const input = parseFloat(document.getElementById('amountInput').value);
    const amount = pickedAmount || (input > 0 ? input : null);
    if (!amount) return toast('Введите сумму пополнения', 'bad');
    try {
        const r = await api('/deposit', { method: 'POST', body: { amount } });
        showRequisites(r.payment_id, `${amount} ${DATA.currency_sign}`);
    } catch (e) { toast(e.message, 'bad'); }
}

// ── Утилиты ──
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s) { return esc(s); }
function fmtDate(iso) {
    try {
        return new Date(iso).toLocaleDateString('ru-RU', { day: '2-digit', month: 'short', year: '2-digit' });
    } catch (e) { return iso; }
}
function fmtPrice(v) { return `${v} ${DATA ? DATA.currency_sign : ''}`; }

// Обновление при возврате в мини-апп (после оплаты в чате и т.п.)
document.addEventListener('visibilitychange', () => {
    if (!document.hidden && TOKEN) refresh();
});

boot();
</script>
</body>
</html>
